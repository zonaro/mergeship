name: Linux host loader smoke tests

on:
  push:
    branches: [feature/linux-native-port]
    paths:
      - 'host/**'
      - 'tools/build_linux_engines.sh'
      - 'Shipwright/CMakeLists.txt'
      - 'Shipwright/soh/CMakeLists.txt'
      - 'Shipwright/libultraship/src/CMakeLists.txt'
      - '2ship2harkinian/CMakeLists.txt'
      - '2ship2harkinian/mm/CMakeLists.txt'
      - 'include/mergeship/**'
      - '.github/workflows/linux-probe.yml'
  pull_request:
    paths:
      - 'host/**'
      - 'include/mergeship/**'
      - '.github/workflows/linux-probe.yml'
  workflow_dispatch:

jobs:
  loader:
    name: ELF loader / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ clang
      - name: Validate Linux engine build script
        run: bash -n tools/build_linux_engines.sh
      - name: Configure probe
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S host -B build/linux-host -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DMERGESHIP_BUILD_LINUX_HOST=OFF
      - name: Build
        run: cmake --build build/linux-host -j 2
      - name: Test
        run: ctest --test-dir build/linux-host --output-on-failure
